<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>WhatsApp QR Login</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			margin: 0;
			padding: 32px;
			text-align: center;
		}

		h1 {
			margin-top: 0;
		}

		canvas {
			margin-top: 20px;
			max-width: 320px;
			width: 100%;
		}

		.hidden {
			display: none;
		}
	</style>
</head>
<body>
	<main>
		<h1>WhatsApp QR Login</h1>
		<p id="status">Waiting for QR...</p>
		<canvas id="qr" width="320" height="320" class="hidden"></canvas>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
	<script>
		const statusEl = document.getElementById('status')
		const qrCanvas = document.getElementById('qr')
		const data = __QR_LOGIN_STATUS__

		if (data.connected) {
			statusEl.textContent = 'Connected'
		} else if (data.qr) {
			statusEl.textContent = 'Scan this QR in WhatsApp Linked devices'
			qrCanvas.classList.remove('hidden')
			QRCode.toCanvas(qrCanvas, data.qr, { width: 320 })
			setTimeout(() => location.reload(), 30000)
		} else {
			statusEl.textContent = 'Waiting for QR...'
			setTimeout(() => location.reload(), 2000)
		}
	</script>
</body>
</html>
